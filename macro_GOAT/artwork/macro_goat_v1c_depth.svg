<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Macro Goat logo, v1c with structural depth lines</title>
<desc>Low-poly technical goat head with closed-loop horns and resistor beard, doubled outline strokes on structural elements for a layered technical-drawing depth effect</desc>

<!-- double border -->
<rect x="0.5" y="0.5" width="511" height="511" fill="none" stroke="#000000" stroke-width="1"/>
<rect x="8.5" y="8.5" width="495" height="495" fill="none" stroke="#000000" stroke-width="1"/>

<g fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

<!-- left horn: main loop trace + doubled offset trace -->
<path d="M 196 150
         L 196 110
         L 150 110
         L 150 60
         L 100 60
         L 100 100
         L 130 100"/>
<g transform="translate(4,4)" stroke-width="2">
<path d="M 196 150
         L 196 110
         L 150 110
         L 150 60
         L 100 60
         L 100 100
         L 130 100"/>
</g>
<circle cx="196" cy="150" r="5" fill="#000000"/>
<circle cx="150" cy="110" r="5" fill="#000000"/>
<circle cx="100" cy="60" r="5" fill="#000000"/>
<circle cx="130" cy="100" r="5" fill="#000000"/>

<!-- right horn: mirrored loop + doubled offset trace -->
<path d="M 316 150
         L 316 110
         L 362 110
         L 362 60
         L 412 60
         L 412 100
         L 382 100"/>
<g transform="translate(-4,4)" stroke-width="2">
<path d="M 316 150
         L 316 110
         L 362 110
         L 362 60
         L 412 60
         L 412 100
         L 382 100"/>
</g>
<circle cx="316" cy="150" r="5" fill="#000000"/>
<circle cx="362" cy="110" r="5" fill="#000000"/>
<circle cx="412" cy="60" r="5" fill="#000000"/>
<circle cx="382" cy="100" r="5" fill="#000000"/>

<!-- low-poly goat head: outline + inset doubled outline -->
<path d="M 256 150
         L 196 150
         L 176 230
         L 200 320
         L 232 380
         L 256 420
         L 280 380
         L 312 320
         L 336 230
         L 316 150
         Z"/>
<g transform="translate(256,285) scale(0.945) translate(-256,-285)" stroke-width="2">
<path d="M 256 150
         L 196 150
         L 176 230
         L 200 320
         L 232 380
         L 256 420
         L 280 380
         L 312 320
         L 336 230
         L 316 150
         Z"/>
</g>

<!-- internal facet lines -->
<path d="M 256 150 L 256 420"/>
<path d="M 196 150 L 232 260 L 256 420"/>
<path d="M 316 150 L 280 260 L 256 420"/>
<path d="M 176 230 L 232 260"/>
<path d="M 336 230 L 280 260"/>

<!-- small forehead chip pad -->
<rect x="246" y="176" width="20" height="14" rx="2"/>

<!-- ears -->
<path d="M 176 230 L 140 215 L 150 250 Z"/>
<path d="M 336 230 L 372 215 L 362 250 Z"/>

<!-- eyes -->
<rect x="222" y="230" width="14" height="6" fill="#000000" stroke="none"/>
<rect x="276" y="230" width="14" height="6" fill="#000000" stroke="none"/>

<!-- beard: resistor body, outline doubled with inset rect, plus leads -->
<path d="M 256 420 L 256 432"/>
<rect x="244" y="432" width="24" height="26" rx="3"/>
<rect x="247" y="435" width="18" height="20" rx="2" stroke-width="2"/>
<path d="M 248 436 L 248 458" stroke-width="2.5"/>
<path d="M 256 436 L 256 458" stroke-width="2.5"/>
<path d="M 264 436 L 264 458" stroke-width="2.5"/>
<path d="M 256 458 L 256 472"/>
<circle cx="256" cy="476" r="5" fill="#000000"/>

</g>
</svg>
